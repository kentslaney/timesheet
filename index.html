<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create Google Spreadsheets from SheetSDK JavaScript files. Upload your .js spec and generate spreadsheets instantly.">
  <title>SheetSDK — Spreadsheet Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <main class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <div>
          <h1>SheetSDK</h1>
          <p class="tagline">JS → Google Sheets</p>
        </div>
      </div>
      <div class="auth-area">
        <span id="auth-status" class="auth-badge signed-out">Not signed in</span>
        <button id="sign-in-btn" class="btn btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </button>
        <button id="sign-out-btn" class="btn btn-ghost hidden">Sign out</button>
      </div>
    </header>

    <!-- File Upload -->
    <section class="card">
      <div class="card-header">
        <h2>
          <span class="step-number">1</span>
          Upload SheetSDK File
        </h2>
      </div>
      <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-content">
          <div class="upload-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="drop-text">Drop your <code>.js</code> file here or <span class="browse-link">browse</span></p>
          <p class="drop-hint">File must begin with <code>"use sheetsdk"</code></p>
        </div>
        <input type="file" id="file-input" accept=".js" class="hidden">
      </div>
      <div id="file-info" class="file-info hidden">
        <span id="file-status" class="file-status"></span>
        <span id="file-name" class="file-name"></span>
        <button id="remove-file" class="btn-icon hidden" title="Remove file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Preview -->
    <section id="preview-section" class="card hidden">
      <div class="card-header">
        <h2>
          <span class="step-number">2</span>
          Preview
        </h2>
      </div>
      <div class="table-wrap">
        <table class="preview-table">
          <thead>
            <tr>
              <th>Sheet</th>
              <th>Formulas</th>
              <th>Values</th>
              <th>Notes</th>
              <th>Cond. Fmt</th>
            </tr>
          </thead>
          <tbody id="preview-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Create -->
    <section id="create-section" class="card hidden">
      <div class="card-header">
        <h2>
          <span class="step-number">3</span>
          Create Spreadsheet
        </h2>
      </div>
      <div class="create-form">
        <div class="input-group">
          <label for="spreadsheet-title">Title</label>
          <input type="text" id="spreadsheet-title" placeholder="My Spreadsheet" class="text-input">
        </div>
        <button id="create-btn" class="btn btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
          Create Spreadsheet
        </button>
      </div>
    </section>

    <!-- Status -->
    <section id="status-section" class="hidden">
      <div id="status-message" class="status-msg"></div>
    </section>

    <!-- Result -->
    <section id="result-section" class="card result-card hidden">
      <div class="result-content">
        <div class="result-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
        <div>
          <p class="result-title">Spreadsheet created!</p>
          <a id="result-link" href="#" target="_blank" rel="noopener" class="result-link">Open in Google Sheets →</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="parser.js"></script>
  <script src="sheets-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
